spring:
  application:
    name: evi-login-processor

  datasource:
    url: jdbc:h2:mem:logindb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: update

    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: login-processing-service
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
        properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          spring.json.value.default.type: com.example.loginprocessor.model.CustomerLoginEvent
          spring.json.trusted.packages: com.example.loginprocessor.model
          spring.json.use.type.headers: false
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
        properties:
          spring.json.add.type.headers: false

app:
  kafka:
    input-topic: customer-login
    output-topic: login-tracking-result